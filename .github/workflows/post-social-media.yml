name: Post New Event to Social Media

on:
  push:
    branches: ["main"]
    paths:
      - '_events/**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "event-notifications"
  cancel-in-progress: false

jobs:
  detect-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml tweepy atproto instagrapi

      - name: Detect and post new events
        id: post
        env:
          # X / Twitter API credentials (OAuth 1.0a)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Bluesky credentials
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          # Instagram credentials
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          # Site
          SITE_URL: ${{ vars.SITE_URL || 'https://sparklingpinkpandas.com' }}
        run: |
          python3 << 'PYEOF'
          import os, yaml, sys, datetime

          events_dir = '_events'
          site_url = os.environ["SITE_URL"]
          today = datetime.date.today()

          def parse_event_file(filepath):
              """Parse event file, return (meta, fm_raw, rest) or None."""
              with open(filepath, 'r') as f:
                  content = f.read()
              if not content.startswith('---'):
                  return None
              close = content.find('\n---', 3)
              if close == -1:
                  return None
              fm_raw = content[3:close]
              meta = yaml.safe_load(fm_raw) or {}
              rest = content[close + 4:]
              return meta, fm_raw, rest

          def build_event_url(filename):
              """Build site URL from filename (YYYY-MM-DD-slug.md -> /events/YYYY/MM/slug/)."""
              parts_name = filename.replace('.md', '').split('-')
              year = parts_name[0]
              month = parts_name[1]
              slug = '-'.join(parts_name[3:])
              return f"{site_url}/events/{year}/{month}/{slug}/"

          def build_post_text(meta, url):
              """Build a social media post from event metadata."""
              title = meta.get('title', 'New Event')
              date = str(meta.get('date', ''))
              time_str = meta.get('time', '')
              location = meta.get('location', '')

              lines = [f"New event: {title}"]
              date_line = f"Date: {date}"
              if time_str:
                  date_line += f" at {time_str}"
              lines.append(date_line)
              if location:
                  lines.append(f"Location: {location}")
              lines.append("")
              lines.append(url)
              lines.append("")
              lines.append("#SparklingPinkPandas #TransRiders #ScooterLife #SanFrancisco")
              return "\n".join(lines)

          def update_frontmatter(filepath, fm_raw, rest, new_fields):
              """Add fields to frontmatter, preserving formatting."""
              additions = []
              for key, value in new_fields.items():
                  if isinstance(value, str):
                      additions.append(f'{key}: "{value}"')
                  else:
                      additions.append(f'{key}: {value}')
              new_fm = fm_raw.rstrip('\n') + '\n' + '\n'.join(additions) + '\n'
              new_content = '---' + new_fm + '---' + rest
              with open(filepath, 'w') as f:
                  f.write(new_content)

          def post_to_x(text):
              """Post to X/Twitter. Returns tweet URL on success, None on failure."""
              api_key = os.environ.get("X_API_KEY")
              api_secret = os.environ.get("X_API_SECRET")
              access_token = os.environ.get("X_ACCESS_TOKEN")
              access_secret = os.environ.get("X_ACCESS_SECRET")

              if not all([api_key, api_secret, access_token, access_secret]):
                  print("X/Twitter credentials not configured, skipping.")
                  return None

              try:
                  import tweepy
                  client = tweepy.Client(
                      consumer_key=api_key,
                      consumer_secret=api_secret,
                      access_token=access_token,
                      access_token_secret=access_secret,
                  )
                  response = client.create_tweet(text=text)
                  tweet_id = response.data['id']
                  print(f"Posted to X: {tweet_id}")
                  return f"https://x.com/i/status/{tweet_id}"
              except Exception as e:
                  print(f"Error posting to X: {e}")
                  return None

          def post_to_bluesky(text):
              """Post to Bluesky. Returns post URL on success, None on failure."""
              handle = os.environ.get("BSKY_HANDLE")
              password = os.environ.get("BSKY_PASSWORD")

              if not all([handle, password]):
                  print("Bluesky credentials not configured, skipping.")
                  return None

              try:
                  from atproto import Client
                  client = Client()
                  client.login(handle, password)
                  response = client.send_post(text=text)
                  rkey = response.uri.split('/')[-1]
                  url = f"https://bsky.app/profile/{handle}/post/{rkey}"
                  print(f"Posted to Bluesky: {url}")
                  return url
              except Exception as e:
                  print(f"Error posting to Bluesky: {e}")
                  return None

          def post_to_instagram(text):
              """Post to Instagram. Returns media PK on success, None on failure."""
              username = os.environ.get("IG_USERNAME")
              password = os.environ.get("IG_PASSWORD")

              if not all([username, password]):
                  print("Instagram credentials not configured, skipping.")
                  return None

              try:
                  from instagrapi import Client as IGClient
                  from PIL import Image, ImageDraw, ImageFont
                  import textwrap

                  # Create a simple branded image for the post
                  img = Image.new('RGB', (1080, 1080), color=(255, 77, 240))
                  draw = ImageDraw.Draw(img)

                  try:
                      font_large = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 48)
                      font_small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 32)
                  except Exception:
                      font_large = ImageFont.load_default()
                      font_small = ImageFont.load_default()

                  draw.text((540, 200), "Sparkling Pink Pandas", fill="white", font=font_large, anchor="mm")
                  draw.text((540, 280), "NEW EVENT", fill="white", font=font_small, anchor="mm")

                  wrapped = textwrap.fill(text.split("#")[0].strip(), width=35)
                  y_pos = 400
                  for line in wrapped.split("\n")[:10]:
                      draw.text((540, y_pos), line, fill="white", font=font_small, anchor="mm")
                      y_pos += 45

                  img_path = "/tmp/event_post.jpg"
                  img.save(img_path)

                  client = IGClient()
                  client.login(username, password)
                  media = client.photo_upload(img_path, caption=text)
                  print(f"Posted to Instagram: {media.pk}")
                  return str(media.pk)
              except Exception as e:
                  print(f"Error posting to Instagram: {e}")
                  return None

          # Find events that need posting: missing any posted_* field and date in the future
          pending = []
          for filename in sorted(os.listdir(events_dir)):
              if not filename.endswith('.md'):
                  continue
              filepath = os.path.join(events_dir, filename)
              result = parse_event_file(filepath)
              if result is None:
                  continue
              meta, fm_raw, rest = result

              event_date = meta.get('date')
              if not event_date:
                  continue
              if hasattr(event_date, 'date'):
                  event_date = event_date.date()
              if event_date < today:
                  continue

              needs_x = not meta.get('posted_x')
              needs_bsky = not meta.get('posted_bluesky')
              needs_ig = not meta.get('posted_instagram')

              if not (needs_x or needs_bsky or needs_ig):
                  continue

              pending.append((filepath, filename, meta, fm_raw, rest, needs_x, needs_bsky, needs_ig))

          if not pending:
              print("No events need posting.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("updated=false\n")
              exit(0)

          updated_any = False
          for filepath, filename, meta, fm_raw, rest, needs_x, needs_bsky, needs_ig in pending:
              url = build_event_url(filename)
              text = build_post_text(meta, url)
              print(f"--- Processing: {meta.get('title')} ---")
              print(text)
              print("---")

              new_fields = {}

              if needs_x:
                  result = post_to_x(text)
                  if result:
                      new_fields['posted_x'] = result

              if needs_bsky:
                  result = post_to_bluesky(text)
                  if result:
                      new_fields['posted_bluesky'] = result

              if needs_ig:
                  result = post_to_instagram(text)
                  if result:
                      new_fields['posted_instagram'] = result

              if new_fields:
                  update_frontmatter(filepath, fm_raw, rest, new_fields)
                  updated_any = True
                  print(f"Updated {filename} with: {', '.join(new_fields.keys())}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"updated={'true' if updated_any else 'false'}\n")

          PYEOF

      - name: Commit tracking updates
        if: steps.post.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add _events/*.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark events as posted to social media [skip ci]"
          git push
