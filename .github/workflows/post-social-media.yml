name: Post New Event to Social Media

on:
  push:
    branches: ["main"]
    paths:
      - '_events/**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "event-notifications"
  cancel-in-progress: false

jobs:
  detect-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml tweepy atproto instagrapi

      - name: Detect and post new events
        id: post
        env:
          # X / Twitter API credentials (OAuth 1.0a)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Bluesky credentials
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          # Instagram credentials
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          # Site
          SITE_URL: ${{ vars.SITE_URL || 'https://sparklingpinkpandas.com' }}
        run: python3 scripts/post_social_media.py

      - name: Commit tracking updates
        if: steps.post.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add _events/*.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark events as posted to social media [skip ci]"
          git push
