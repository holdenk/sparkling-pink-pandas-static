name: Notify Google Group on New Event

on:
  push:
    branches: ["main"]
    paths:
      - '_events/**.md'
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "event-notifications"
  cancel-in-progress: false

jobs:
  detect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect and email new events
        id: notify
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM || $secrets.NOTIFY_FROM ||  secrets.SMPT_USERNAME }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO || $secrets.NOTIFY_TO || "SparklingPinkPandas@groups.google.com" }}
          SITE_URL: ${{ vars.SITE_URL || 'https://sparklingpinkpandas.com' }}
        run: |
          python3 << 'PYEOF'
          import os, yaml, smtplib, datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          events_dir = '_events'
          site_url = os.environ["SITE_URL"]
          today = datetime.date.today()

          # Find events that need emailing: no 'emailed' field and date in the future
          pending = []
          for filename in sorted(os.listdir(events_dir)):
              if not filename.endswith('.md'):
                  continue
              filepath = os.path.join(events_dir, filename)
              with open(filepath, 'r') as f:
                  content = f.read()
              if not content.startswith('---'):
                  continue
              close = content.find('\n---', 3)
              if close == -1:
                  continue
              fm_raw = content[3:close]
              meta = yaml.safe_load(fm_raw) or {}
              rest = content[close + 4:]

              if meta.get('emailed'):
                  continue
              event_date = meta.get('date')
              if not event_date:
                  continue
              if hasattr(event_date, 'date'):
                  event_date = event_date.date()
              if event_date < today:
                  continue

              pending.append((filepath, filename, meta, fm_raw, rest))

          if not pending:
              print("No events need emailing.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("updated=false\n")
              exit(0)

          smtp_host = os.environ.get("SMTP_HOST", "")
          smtp_port = os.environ.get("SMTP_PORT", "")
          smtp_user = os.environ.get("SMTP_USERNAME", "")
          smtp_pass = os.environ.get("SMTP_PASSWORD", "")
          notify_from = os.environ.get("NOTIFY_FROM", "")
          notify_to = os.environ["NOTIFY_TO"]

          if not all([smtp_host, smtp_port, smtp_user, smtp_pass]):
              print("SMTP credentials not configured, skipping email.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("updated=false\n")
              exit(0)

          updated_any = False
          for filepath, filename, meta, fm_raw, rest in pending:
              title = meta.get('title', 'New Event')
              date = str(meta.get('date', ''))
              time_str = meta.get('time', '')
              location = meta.get('location', '')
              description = meta.get('description', '')

              # Build URL from filename (YYYY-MM-DD-slug.md -> /events/YYYY/MM/slug/)
              parts_name = filename.replace('.md', '').split('-')
              year = parts_name[0]
              month = parts_name[1]
              slug = '-'.join(parts_name[3:])
              event_url = f"{site_url}/events/{year}/{month}/{slug}/"

              # Build email
              subject = f"New SPP Event: {title}"

              text_body = f"""{title}
          {'=' * len(title)}

          Date: {date}"""
              if time_str:
                  text_body += f"\nTime: {time_str}"
              if location:
                  text_body += f"\nLocation: {location}"
              text_body += f"""

          {description}

          View event: {event_url}

          --
          Sparkling Pink Pandas
          {site_url}
          """

              html_body = f"""<h2>{title}</h2>
          <p><strong>Date:</strong> {date}</p>"""
              if time_str:
                  html_body += f"<p><strong>Time:</strong> {time_str}</p>"
              if location:
                  html_body += f"<p><strong>Location:</strong> {location}</p>"
              if description:
                  html_body += f"<p>{description}</p>"
              html_body += f"""<hr>
          <p><a href="{event_url}">View event on our website</a></p>
          <hr>
          <p><em>Sparkling Pink Pandas</em><br>
          <a href="{site_url}">{site_url}</a></p>
          """

              msg = MIMEMultipart("alternative")
              msg["Subject"] = subject
              msg["From"] = notify_from
              msg["To"] = notify_to
              msg.attach(MIMEText(text_body, "plain"))
              msg.attach(MIMEText(html_body, "html"))

              try:
                  with smtplib.SMTP(smtp_host, int(smtp_port)) as server:
                      server.starttls()
                      server.login(smtp_user, smtp_pass)
                      server.sendmail(notify_from, [notify_to], msg.as_string())
                  print(f"Email sent for event: {title}")
              except Exception as e:
                  print(f"Error sending email for {title}: {e}")
                  continue

              # Update frontmatter with emailed date
              new_fm = fm_raw.rstrip('\n') + f'\nemailed: "{today.isoformat()}"\n'
              new_content = '---' + new_fm + '---' + rest
              with open(filepath, 'w') as f:
                  f.write(new_content)
              updated_any = True
              print(f"Marked {filename} as emailed.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"updated={'true' if updated_any else 'false'}\n")

          PYEOF

      - name: Commit tracking updates
        if: steps.notify.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _events/*.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark events as emailed [skip ci]"
          git push
