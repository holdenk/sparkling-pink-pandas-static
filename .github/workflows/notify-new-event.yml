name: Notify Google Group on New Event

on:
  push:
    branches: ["main"]
    paths:
      - '_events/**.md'
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "event-notifications"
  cancel-in-progress: false

jobs:
  detect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect and email new events
        id: notify
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM || secrets.NOTIFY_FROM || secrets.SMTP_USERNAME }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO || secrets.NOTIFY_TO || 'SparklingPinkPandas@googlegroups.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://sparklingpinkpandas.com' }}
        run: python3 scripts/notify_events.py

      - name: Commit tracking updates
        if: steps.notify.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _events/*.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark events as emailed [skip ci]"
          git push
