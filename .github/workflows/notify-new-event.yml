name: Notify Google Group on New Event

on:
  push:
    branches: ["main"]
    paths:
      - '_events/**'

jobs:
  detect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new event files
        id: detect
        run: |
          # Find newly added event files in this push
          NEW_EVENTS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '_events/*.md' || true)
          if [ -z "$NEW_EVENTS" ]; then
            echo "No new events detected."
            echo "has_new_events=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_new_events=true" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_EVENTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Parse event and send email
        if: steps.detect.outputs.has_new_events == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_FROM: ${{ secrets.SMTP_USERNAME }}
          NOTIFY_TO: "SparklingPinkPandas@groups.google.com"
          SITE_URL: ${{ vars.SITE_URL || 'https://sparklingpinkpandas.com' }}
        run: |
          pip install pyyaml

          python3 << 'PYEOF'
          import os, yaml, smtplib, glob
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          event_files = os.environ.get("files", "").strip().split("\n")
          if not event_files or event_files == ['']:
              print("No event files to process")
              exit(0)

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])
          smtp_user = os.environ["SMTP_USERNAME"]
          smtp_pass = os.environ["SMTP_PASSWORD"]
          notify_from = os.environ["NOTIFY_FROM"]
          notify_to = os.environ["NOTIFY_TO"]
          site_url = os.environ["SITE_URL"]

          for filepath in event_files:
              filepath = filepath.strip()
              if not filepath or not os.path.exists(filepath):
                  continue

              with open(filepath, 'r') as f:
                  content = f.read()

              # Parse front matter
              parts = content.split('---', 2)
              if len(parts) < 3:
                  continue
              meta = yaml.safe_load(parts[1])
              body = parts[2].strip()

              title = meta.get('title', 'New Event')
              date = str(meta.get('date', ''))
              time_str = meta.get('time', '')
              location = meta.get('location', '')
              description = meta.get('description', '')

              # Build slug from filename
              filename = os.path.basename(filepath).replace('.md', '')
              # Remove date prefix (YYYY-MM-DD-)
              slug = '-'.join(filename.split('-')[3:])
              event_url = f"{site_url}/events/{slug}/"

              # Build email
              subject = f"New SPP Event: {title}"

              text_body = f"""{title}
          {'=' * len(title)}

          Date: {date}"""
              if time_str:
                  text_body += f"\nTime: {time_str}"
              if location:
                  text_body += f"\nLocation: {location}"
              text_body += f"""

          {description}

          {body}

          View event: {event_url}

          --
          Sparkling Pink Pandas
          {site_url}
          """

              html_body = f"""<h2>{title}</h2>
          <p><strong>Date:</strong> {date}</p>"""
              if time_str:
                  html_body += f"<p><strong>Time:</strong> {time_str}</p>"
              if location:
                  html_body += f"<p><strong>Location:</strong> {location}</p>"
              if description:
                  html_body += f"<p>{description}</p>"
              html_body += f"""<hr>
          <p>{body.replace(chr(10), '<br>')}</p>
          <p><a href="{event_url}">View event on our website</a></p>
          <hr>
          <p><em>Sparkling Pink Pandas</em><br>
          <a href="{site_url}">{site_url}</a></p>
          """

              msg = MIMEMultipart("alternative")
              msg["Subject"] = subject
              msg["From"] = notify_from
              msg["To"] = notify_to
              msg.attach(MIMEText(text_body, "plain"))
              msg.attach(MIMEText(html_body, "html"))

              with smtplib.SMTP(smtp_host, smtp_port) as server:
                  server.starttls()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(notify_from, [notify_to], msg.as_string())

              print(f"Email sent for event: {title}")

          PYEOF
        env:
          files: ${{ steps.detect.outputs.files }}
